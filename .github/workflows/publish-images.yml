name: Publish Docker images to GHCR

# Builds both app images (docker/backend.Dockerfile, docker/frontend.Dockerfile)
# and pushes them to ghcr.io/<owner>/echo-backend and echo-frontend.
# Auto-runs when code that actually affects the images changes; always
# available on-demand via the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docker/**"
      - "pyproject.toml"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch: {}

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: echo-backend
            dockerfile: docker/backend.Dockerfile
          - image: echo-frontend
            dockerfile: docker/frontend.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
